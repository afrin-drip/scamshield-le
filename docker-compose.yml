version: '3.9'
services:
  api:
    build: ./api
    ports: ['4000:4000']
    env_file: .env
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - api_modules:/app/node_modules

  le-portal:
    build: ./le-portal
    ports: ['3001:3001']
    env_file: .env
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - le_portal_modules:/app/node_modules

  retirement-portal:
    build: ./retirement-portal
    ports: ['3002:3002']
    env_file: .env
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - retirement_modules:/app/node_modules

  web:
    build: ./web
    ports: ['3000:3000']
    env_file: .env
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - web_modules:/app/node_modules

volumes:
  api_modules:
  le_portal_modules:
  retirement_modules:
  web_modules: